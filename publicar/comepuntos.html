<title>ComePuntos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1f1d2b; --muted:#6c6879; --line:#e4e0d6;
  --accent:#5a48e0; --accent-ink:#ffffff; --accent-soft:#ece9ff;
  --ok:#1e9e57; --ok-soft:#e1f6e9; --bad:#d94343; --bad-soft:#fde7e7;
  --warn:#b97a12; --warn-soft:#fdf2d8; --chip:#ffffff; --chip-line:#d9d4c8;
  --code-bg:#1d1c2a; --code-ink:#ebe9f7; --code-muted:#8a87a3; --game-bg:#0c0b16;
  --locked:#c9c4b8; --shadow:0 2px 0 rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15141d; --panel:#1f1e2a; --ink:#ecebf3; --muted:#a19fb3; --line:#33313f;
    --accent:#8b7cff; --accent-ink:#14131c; --accent-soft:#2b2747;
    --ok:#3ccf7f; --ok-soft:#173326; --bad:#ff6b6b; --bad-soft:#3a1d22;
    --warn:#f0b445; --warn-soft:#3a2f17; --chip:#272635; --chip-line:#45434f;
    --code-bg:#11101a; --locked:#4a4856; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15141d; --panel:#1f1e2a; --ink:#ecebf3; --muted:#a19fb3; --line:#33313f;
  --accent:#8b7cff; --accent-ink:#14131c; --accent-soft:#2b2747;
  --ok:#3ccf7f; --ok-soft:#173326; --bad:#ff6b6b; --bad-soft:#3a1d22;
  --warn:#f0b445; --warn-soft:#3a2f17; --chip:#272635; --chip-line:#45434f;
  --code-bg:#11101a; --locked:#4a4856; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
code,pre,.mono,textarea.editor{font-family:Consolas,"Cascadia Mono","Courier New",monospace}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}

/* ---------- barra superior ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.barra{max-width:1280px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo .bolita{width:22px;height:22px;border-radius:50%;background:#ffcc33;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}
.stats{display:flex;gap:10px;margin-left:auto;align-items:center;flex-wrap:wrap}
.stat{font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.btn-sec{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:10px;font-weight:600}
.btn-sec:hover{border-color:var(--accent)}

/* ---------- layout ---------- */
main>section{min-width:0}
main{max-width:1280px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:20px;align-items:start}
@media (max-width:1050px){main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.juego-col{position:sticky;top:calc(76px + env(safe-area-inset-top,0px))}
@media (max-width:1050px){.juego-col{position:static}}

/* ---------- camino ---------- */
.intro{padding:20px 22px;margin-bottom:16px}
.intro h1{margin:0 0 6px;font-size:24px}
.intro p{margin:0;color:var(--muted)}
.camino{padding:24px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:6px}
.paso{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.nodo-camino{width:78px;height:78px;border-radius:50%;border:none;font-size:32px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .1s}
.nodo-camino:hover:not(:disabled){transform:translateY(-2px)}
.nodo-camino:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.nodo-camino.hecho{background:var(--ok)}
.nodo-camino.bloqueado{background:var(--locked);box-shadow:0 6px 0 rgba(0,0,0,.08);filter:grayscale(1)}
.nodo-camino.actual{outline:4px solid var(--accent-soft);outline-offset:4px;animation:latido 1.6s infinite}
@keyframes latido{50%{outline-offset:8px}}
.etiqueta-camino{text-align:center;font-weight:700;font-size:15px}
.etiqueta-camino small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.conector{width:4px;height:22px;background:var(--line);border-radius:2px}

/* ---------- juego ---------- */
.juego{padding:14px}
.juego h2{margin:0 0 8px;font-size:17px;display:flex;align-items:center;justify-content:space-between}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hud span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-weight:700;font-size:14px}
.lienzo-caja{position:relative;background:var(--game-bg);border-radius:12px;overflow:hidden;line-height:0}
canvas{width:100%;height:auto;display:block}
.controles{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,34px);gap:4px;margin-left:auto}
.dpad button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:16px}
.dpad .up{grid-column:2}
.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
.ayuda-juego{font-size:13px;color:var(--muted);margin:8px 0 0}
.piezas{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pieza{font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.pieza.si{background:var(--ok-soft);border-color:transparent}
.pieza.no{color:var(--muted)}
.aviso-juego{margin-top:8px;font-size:13px;padding:6px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad);display:none}

/* ---------- lección ---------- */
.leccion{padding:18px 22px 0;min-height:560px;display:flex;flex-direction:column}
.lec-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.cerrar{border:none;background:none;font-size:24px;color:var(--muted);padding:0 4px}
.progreso{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.progreso div{height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.corazones{font-weight:800;color:var(--bad);white-space:nowrap}
.ejercicio{flex:1}
.tipo{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.ejercicio h3{font-size:21px;margin:0 0 14px;line-height:1.35}
.ejercicio p{margin:0 0 12px}
.teoria{font-size:16.5px}
.teoria .ejemplo{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:12px 0}
pre.codigo, .codigo-linea-caja{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:12px 14px;margin:10px 0;overflow-x:auto;font-size:15px;line-height:1.55}
code.in{background:var(--accent-soft);padding:1px 6px;border-radius:6px;font-size:.92em}
pre.codigo .com{color:var(--code-muted)}
.opciones{display:grid;gap:10px}
.opcion{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.opcion:hover{border-color:var(--accent)}
.opcion.sel{border-color:var(--accent);background:var(--accent-soft)}
.opcion.bien{border-color:var(--ok);background:var(--ok-soft)}
.opcion.mal{border-color:var(--bad);background:var(--bad-soft)}
.opcion code{font-size:14px}
.banco{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:2px dashed var(--line);min-height:56px}
.ficha{padding:7px 12px;border-radius:10px;border:2px solid var(--chip-line);background:var(--chip);color:var(--ink);font-family:Consolas,"Courier New",monospace;font-size:15px;box-shadow:0 2px 0 var(--chip-line)}
.ficha:hover{border-color:var(--accent)}
.ficha.usada{visibility:hidden}
.hueco{display:inline-block;min-width:54px;padding:1px 8px;border-bottom:2px solid var(--code-muted);margin:0 2px;text-align:center;cursor:pointer;color:#ffd866;min-height:1.4em;vertical-align:bottom}
.hueco.vacio{color:transparent}
.hueco.bien{color:#5ee59a;border-color:#5ee59a}
.hueco.mal{color:#ff8080;border-color:#ff8080}
.respuesta-orden{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.respuesta-orden .ficha{align-self:flex-start;text-align:left}
.diagrama{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:6px 0}
.dnodo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.forma{padding:8px 14px;border-radius:10px;font-weight:600;font-size:15px;border:2px solid transparent}
.f-inicio,.f-fin{background:var(--ok-soft);border-color:var(--ok);border-radius:999px}
.f-proc{background:var(--accent-soft);border-color:var(--accent)}
.f-dec{background:var(--warn-soft);border-color:var(--warn);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);padding:8px 24px;border:none}
.f-ciclo{background:#efe3ff;border-color:#9b5de5;color:#3b1d6e}
:root[data-theme="dark"] .f-ciclo{background:#33244d;color:#e6d6ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .f-ciclo{background:#33244d;color:#e6d6ff}}
.f-ret{background:var(--bad-soft);border-color:var(--bad)}
.flecha-si{font-weight:800;color:var(--ok);font-size:14px}
.flecha-abajo{color:var(--muted);font-weight:700;font-size:14px;padding:2px 0 2px 18px}
.diagrama .hueco{color:var(--accent);border-color:var(--accent);font-family:Consolas,"Courier New",monospace}
.diagrama .hueco.vacio{color:transparent}
.diagrama .hueco.bien{color:var(--ok);border-color:var(--ok)}
.diagrama .hueco.mal{color:var(--bad);border-color:var(--bad)}
.lineas-revisar{background:var(--code-bg);border-radius:12px;padding:8px 0;margin:10px 0;overflow-x:auto}
.lineas-revisar button{display:block;width:100%;text-align:left;border:none;background:none;color:var(--code-ink);font-family:Consolas,"Courier New",monospace;font-size:15px;padding:3px 14px;white-space:pre}
.lineas-revisar button:hover{background:rgba(255,255,255,.06)}
.lineas-revisar button.sel{background:rgba(255,216,102,.18);outline:1px solid #ffd866}
.lineas-revisar button.bien{background:rgba(94,229,154,.18)}
.lineas-revisar button .num{color:var(--code-muted);display:inline-block;width:28px}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.burbuja{padding:12px 14px;border-radius:14px;max-width:92%}
.burbuja.yo{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;white-space:pre-wrap}
.burbuja.ia{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.burbuja.ia pre{background:var(--code-bg);color:var(--code-ink);padding:10px;border-radius:8px;overflow-x:auto;font-size:14px;margin:8px 0}
.quien{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
textarea.prompt{width:100%;min-height:110px;border-radius:12px;border:2px solid var(--line);padding:10px 12px;font:inherit;background:var(--panel);color:var(--ink);resize:vertical}
textarea.prompt:focus{outline:none;border-color:var(--accent)}
.checklist{list-style:none;padding:0;margin:10px 0;display:grid;gap:4px;font-size:15px}
.checklist li::before{content:"○ ";color:var(--muted)}
.checklist li.si{color:var(--ok)}
.checklist li.si::before{content:"✓ ";font-weight:800}
.nota{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:15px;margin:10px 0}
/* editor */
.editor-caja{display:flex;background:var(--code-bg);border-radius:12px;overflow:hidden;margin:10px 0}
.gutter{color:var(--code-muted);text-align:right;padding:12px 8px 12px 10px;user-select:none;font-family:Consolas,"Courier New",monospace;font-size:15px;line-height:1.55;white-space:pre;overflow:hidden}
textarea.editor{flex:1;min-height:300px;border:none;outline:none;resize:vertical;background:transparent;color:var(--code-ink);font-size:15px;line-height:1.55;padding:12px 12px 12px 4px;white-space:pre;overflow:auto;tab-size:2}
.pruebas{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px;font-size:14.5px}
.pruebas li{padding:5px 10px;border-radius:8px;font-family:Consolas,"Courier New",monospace}
.pruebas li.si{background:var(--ok-soft)}
.pruebas li.no{background:var(--bad-soft)}
.estado-codigo{font-weight:700;font-size:15px}
.error-codigo{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:15px;margin:8px 0}
.consola{background:var(--code-bg);color:#9fe3b4;border-radius:10px;padding:8px 12px;font-size:13.5px;font-family:Consolas,monospace;max-height:120px;overflow:auto;white-space:pre-wrap}
.pista{background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.acciones-codigo{display:flex;gap:8px;flex-wrap:wrap}
/* pie de lección */
.pie{margin:18px -22px 0;padding:14px 22px;border-top:2px solid var(--line);display:flex;align-items:center;gap:14px;border-radius:0 0 16px 16px;min-height:78px}
.pie.bien{background:var(--ok-soft);border-color:transparent}
.pie.mal{background:var(--bad-soft);border-color:transparent}
.pie .msg{flex:1}
.pie .msg b{display:block;font-size:18px}
.pie.bien .msg b{color:var(--ok)}
.pie.mal .msg b{color:var(--bad)}
.btn-prim{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:12px 26px;font-weight:800;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.2);text-transform:uppercase;letter-spacing:.4px;margin-left:auto}
.btn-prim:disabled{background:var(--locked);box-shadow:none;color:#fff}
.pie.bien .btn-prim{background:var(--ok)}
.pie.mal .btn-prim{background:var(--bad)}
.centro{text-align:center;padding:30px 10px}
.centro .grande{font-size:64px}
.centro h2{font-size:26px;margin:8px 0}
.pasos-vs{display:grid;gap:6px;padding-left:22px}
.reglas{padding:0;margin:0;list-style:none;display:grid;gap:10px}
.reglas li{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.reglas b{display:block}
dialog{border:none;border-radius:18px;padding:0;max-width:640px;width:calc(100% - 32px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:20px 22px}
.dlg h2{margin:0 0 12px}
.oculto{display:none!important}
@media (max-width:600px){
  .leccion{padding:14px 14px 0}
  .pie{margin:18px -14px 0;padding:12px 14px;flex-wrap:wrap}
  .ejercicio h3{font-size:19px}
  .piezas{grid-template-columns:1fr}
}
</style>
<header>
  <div class="barra">
    <div class="logo" id="irInicio"><span class="bolita"></span>ComePuntos</div>
    <div class="stats">
      <span class="stat" title="Experiencia">⚡ <span id="xp">0</span> XP</span>
      <span class="stat" title="Días seguidos practicando">🔥 <span id="racha">0</span></span>
      <button class="btn-sec" id="btnReglas">🤖 Usar bien la IA</button>
      <button class="btn-sec" id="btnSonido" title="Sonido">🔊</button>
    </div>
  </div>
</header>

<main>
  <section id="izq"></section>
  <aside class="juego-col">
    <div class="panel juego">
      <h2><span>🎮 Tu juego</span><button class="btn-sec" id="btnReiniciar">↺ Reiniciar</button></h2>
      <div class="hud">
        <span id="hudPuntos">Puntos: 0</span>
        <span id="hudVidas">Vidas: ❤❤❤</span>
        <span id="hudQuedan">Quedan: ?</span>
        <span id="hudRadar" class="oculto">📏 Fantasma a ?</span>
      </div>
      <div class="lienzo-caja"><canvas id="lienzo" width="456" height="504"></canvas></div>
      <div class="controles">
        <span class="ayuda-juego" style="margin:0">Flechas o W A S D para moverte</span>
        <div class="dpad">
          <button class="up" data-dir="arriba" aria-label="arriba">▲</button>
          <button class="left" data-dir="izquierda" aria-label="izquierda">◀</button>
          <button class="down" data-dir="abajo" aria-label="abajo">▼</button>
          <button class="right" data-dir="derecha" aria-label="derecha">▶</button>
        </div>
      </div>
      <div class="aviso-juego" id="avisoJuego"></div>
      <div class="piezas" id="piezas"></div>
    </div>
  </aside>
</main>

<dialog id="dlgReglas">
  <div class="dlg">
    <h2>🤖 Reglas de oro para usar la IA</h2>
    <ul class="reglas" id="listaReglas"></ul>
    <p style="text-align:right;margin:16px 0 0"><button class="btn-prim" id="cerrarReglas">Entendido</button></p>
  </div>
</dialog>

<!-- ======================================================================
     DATOS: el mapa, las lecciones y utilidades "puras" (sin pantalla).
     ====================================================================== -->
<script id="datos">
"use strict";

const MAPA_TEXTO = [
  "###################",
  "#o.......#.......o#",
  "#.##.###.#.###.##.#",
  "#.................#",
  "#.##.#.#####.#.##.#",
  "#....#...#...#....#",
  "####.###.#.###.####",
  "####.#.......#.####",
  "####.#.## ##.#.####",
  "#......#   #......#",
  "####.#.#####.#.####",
  "####.#.......#.####",
  "####.#.#####.#.####",
  "#........#........#",
  "#.##.###.#.###.##.#",
  "#o.#..... .....#.o#",
  "##.#.#.#####.#.#.##",
  "#....#...#...#....#",
  "#.######.#.######.#",
  "#.................#",
  "###################"
];
const DIRECCIONES = ["arriba", "abajo", "izquierda", "derecha"];

// Los mismos nombres que ConsoleColor de C#, con el color que se ve en la web.
const COLORES_CONSOLA = {
  black: "#000000", darkblue: "#1f2f9e", darkgreen: "#1e7d43", darkcyan: "#178a99",
  darkred: "#a32030", darkmagenta: "#8e3a9e", darkyellow: "#c99a1a", gray: "#b9b9c6",
  darkgray: "#6b6b7a", blue: "#2f5bff", green: "#2ecc71", cyan: "#3fdcf0",
  red: "#ff4d5e", magenta: "#ff6ad5", yellow: "#ffd23f", white: "#ffffff"
};

const REGLAS_IA = [
  ["Da contexto", "Di qué estás haciendo, en qué lenguaje y qué sabes. «Soy principiante, estoy aprendiendo C#…»"],
  ["Sé específico", "«Ayúdame» no dice nada. Di qué método, qué recibe, qué debe devolver y qué pasa ahora."],
  ["Pide que te explique", "Pide explicaciones y ejemplos, no solo la respuesta. Si no lo entiendes, no lo has aprendido."],
  ["Comprueba todo", "La IA se equivoca y a veces inventa cosas con mucha seguridad. Prueba el código y revisa la documentación oficial (Microsoft Learn)."],
  ["Pega el error exacto", "Cuando algo falla, copia el mensaje de error (por ejemplo CS0019) y tu código. Sin eso, la IA solo puede adivinar."],
  ["Pide a tu nivel", "Si te responde con cosas que no conoces (LINQ, lambdas…), dile: «explícamelo solo con if, for y variables»."],
  ["Cuida tus datos", "Nunca compartas contraseñas, tu dirección, teléfono ni datos de otras personas."],
  ["Sé honesto", "Di cuándo usaste IA. Usarla para aprender está bien; presentar como tuyo algo que no entiendes, no."]
];

// Ayudantes que usan las pruebas (se cargan también dentro del Worker).
const HELPERS_SRC = String.raw`
function mostrar(v){
  if (typeof v === "string") return '"' + v + '"';
  if (v === undefined) return "nada";
  if (v === null) return "null";
  if (Array.isArray(v)) return JSON.stringify(v);
  if (typeof v === "function") return "un método";
  return String(v);
}
function caso(desc, obtenido, esperado){
  const ok = obtenido === esperado;
  return { ok: ok, msg: desc + (ok ? "  →  " + mostrar(obtenido) : "  →  esperaba " + mostrar(esperado) + ", tu código dio " + mostrar(obtenido)) };
}
function crearAzar(){
  return {

    int contador = 0;

                contador++;
            }

    return contador;
}

const TIPOS = "int|bool|string|char|double|float|long|var|Random|String";

function separarLiterales(src) {
  // Cambia textos, chars y comentarios por marcadores para que las reglas
  // solo toquen código. Conserva los saltos de línea.
  const lits = [];
  let out = "", i = 0;
  const n = src.length;
  function guardar(tipo, texto) {
    lits.push({ tipo: tipo, texto: texto });
    const saltos = (texto.match(/\n/g) || []).length;
    return "\u0001" + tipo + (lits.length - 1) + "\u0001" + "\n".repeat(saltos);
  }
  while (i < n) {
    const c = src[i], d = src[i + 1];
    if (c === "/" && d === "/") { let j = src.indexOf("\n", i); if (j < 0) j = n; out += guardar("K", src.slice(i, j)); i = j; continue; }
    if (c === "/" && d === "*") { let j = src.indexOf("*/", i + 2); j = j < 0 ? n : j + 2; out += guardar("K", src.slice(i, j)); i = j; continue; }
    if (c === "@" && d === '"') { let j = i + 2; while (j < n && !(src[j] === '"' && src[j + 1] !== '"')) { if (src[j] === '"') j++; j++; } out += guardar("V", src.slice(i, j + 1)); i = j + 1; continue; }
    if ((c === "$" && d === '"') || c === '"') {
      let j = i + (c === "$" ? 2 : 1), sinCerrar = false;
      while (j < n && src[j] !== '"') { if (src[j] === "\\") j++; if (src[j] === "\n") { sinCerrar = true; break; } j++; }
      if (j >= n) sinCerrar = true;
      if (sinCerrar) return { error: { linea: src.slice(0, i).split("\n").length, msg: "Abriste unas comillas \" y no las cerraste." } };
      out += guardar(c === "$" ? "I" : "S", src.slice(i, j + 1)); i = j + 1; continue;
    }
    if (c === "'") {
      let j = i + 1;
      while (j < n && src[j] !== "'" && src[j] !== "\n") { if (src[j] === "\\") j++; j++; }
      if (j >= n || src[j] !== "'") return { error: { linea: src.slice(0, i).split("\n").length, msg: "Abriste una comilla simple ' y no la cerraste." } };
      out += guardar("C", src.slice(i, j + 1)); i = j + 1; continue;
    }
    out += c; i++;
  }
  return { codigo: out, lits: lits };
}

function revisarCSharp(cod, lits) {
  // cod: código con marcadores. Devuelve {linea, msg} o null.
  const lineas = cod.split("\n");
  const M = "\u0001";
  const err = function (k, msg) { return { linea: k + 1, msg: msg }; };
  // char con más de una letra
  for (let k = 0; k < lits.length; k++) {
    const L = lits[k];
    if (L.tipo === "C") {
      const dentro = L.texto.slice(1, -1);
      const largo = dentro.startsWith("\\") ? 1 : dentro.length;
      if (largo !== 1) {
        const ln = cod.split(M + "C" + k + M)[0].split("\n").length;
        return { linea: ln, msg: (largo === 0 ? "Un char no puede estar vacío: ''. " : "Las comillas simples son para UNA sola letra (char): " + L.texto + " tiene " + largo + ". ") + "Si es un texto, usa comillas dobles: \"" + dentro + "\". (error CS1012)" };
      }
    }
  }
  // tipos de variables y parámetros
  const tipos = {};
  const reDecl = new RegExp("\\b(" + TIPOS + ")(\\[\\s*,?\\s*\\])?\\s+([A-Za-z_]\\w*)\\b", "g");
  let m;
  while ((m = reDecl.exec(cod))) tipos[m[3]] = m[1] + (m[2] ? "[]" : "");
  let metodo = null, profundidad = 0, inicioMetodo = 0, tieneReturn = false;
  const reMetodo = new RegExp("^\\s*(?:(?:public|private|static)\\s+)*(void|" + TIPOS + ")(\\[\\s*,?\\s*\\])?\\s+([A-Za-z_]\\w*)\\s*\\(([^)]*)\\)\\s*\\{?\\s*$");
  for (let k = 0; k < lineas.length; k++) {
    const lin = lineas[k].replace(new RegExp(M + "K\\d+" + M, "g"), "");
    const t = lin.trim();
    if (!t) continue;
    // cosas de JavaScript
    if (/\blet\s+\w/.test(t)) return err(k, "En C# no existe «let». Pon el tipo de la variable: int, string, char o bool. Ejemplo: int contador = 0;");
    if (/\bfunction\b/.test(t)) return err(k, "En C# no se escribe «function». Un método empieza con el tipo que devuelve. Ejemplo: int Doble(int numero)");
    if (/===|!==/.test(t)) return err(k, "En C# se compara con == (dos iguales), no con ===.");
    if (/\bconsole\.log\b/i.test(t)) return err(k, "En C# se escribe Console.WriteLine(...), con C y W mayúsculas.");
    if (/\.length\b/.test(t)) return err(k, "En C# se escribe .Length, con L mayúscula.");
    if (/\bMath\.(abs|min|max|floor|round|sqrt|pow)\b/.test(t)) return err(k, "En C# los métodos de Math empiezan con mayúscula: Math.Abs, Math.Min, Math.Max…");
    if (/\b(True|False)\b/.test(t)) return err(k, "En C# true y false se escriben en minúsculas.");
    if (/^(If|For|While|Return|Else|Int|String|Bool)\b/.test(t)) return err(k, "En C# las palabras clave van en minúsculas: if, for, while, return, else, int, bool…");
    if (/\bgetlength\b|\.getLength\b|\.Getlength\b/.test(t)) return err(k, "Se escribe GetLength, con G y L mayúsculas.");
    // = dentro de if/while
    const cond = t.match(/^(?:else\s+)?(?:if|while)\s*\((.*)\)\s*\{?$/);
    if (cond && /(^|[^=!<>])=($|[^=])/.test(cond[1])) return err(k, "Dentro del " + (/while/.test(t) ? "while" : "if") + " se compara con == (dos iguales). Un solo = guarda un valor. (error CS0029)");
    // comparar char con string o string con char
    for (const nom in tipos) {
      const re1 = new RegExp("\\b" + nom + "\\s*[=!]=\\s*" + M + "([SC])\\d+" + M + "|" + M + "([SC])\\d+" + M + "\\s*[=!]=\\s*" + nom + "\\b");
      const mm = t.match(re1);
      if (mm) {
        const lit = mm[1] || mm[2];
        if (tipos[nom] === "char" && lit === "S") return err(k, "«" + nom + "» es un char (una letra), pero lo comparas con un texto entre comillas dobles. Usa comillas simples: '.' en lugar de \".\". (error CS0019)");
        if (tipos[nom] === "string" && lit === "C") return err(k, "«" + nom + "» es un string (texto), pero lo comparas con un char entre comillas simples. Usa comillas dobles: \"arriba\". (error CS0019)");
      }
    }
    // inicio de método
    const mh = metodo ? null : lin.match(reMetodo);
    if (mh && !/^\s*(return|new)\b/.test(lin)) { metodo = { tipo: mh[1] + (mh[2] ? "[]" : ""), nombre: mh[3] }; profundidad = 0; inicioMetodo = k; tieneReturn = false; }
    // return con tipo equivocado
    if (metodo && /^return\b/.test(t)) {
      tieneReturn = true;
      const r = t.replace(/^return\s*/, "").replace(/;\s*$/, "").trim();
      const ty = metodo.tipo;
      const esS = new RegExp("^" + M + "S\\d+" + M + "$").test(r), esC = new RegExp("^" + M + "C\\d+" + M + "$").test(r);
      const esBool = /^(true|false)$/.test(r), esNum = /^-?\d+$/.test(r);
      if (ty === "void" && r) return err(k, "El método " + metodo.nombre + " es void (no devuelve nada), pero tiene un return con valor.");
      if (ty === "int" && (esS || esC || esBool)) return err(k, "El método " + metodo.nombre + " devuelve int (un número), pero aquí devuelves " + (esS ? "un texto" : esC ? "un char" : "un bool") + ". " + (esS ? "Quita las comillas." : ""));
      if (ty === "bool" && (esS || esC || esNum)) return err(k, "El método " + metodo.nombre + " devuelve bool: escribe true o false, sin comillas.");
      if (ty === "string" && (esC || esNum || esBool)) return err(k, "El método " + metodo.nombre + " devuelve string: el texto va entre comillas dobles \"...\"" + (esC ? " (las simples son para char)." : "."));
      if (ty === "char" && (esS || esNum || esBool)) return err(k, "El método " + metodo.nombre + " devuelve char: una letra entre comillas simples, como '#'.");
    }
    // punto y coma
    const sinMarcas = t;
    const esEstructura = /^(if|else|for|foreach|while|switch|case|default|do|try|catch|finally)\b/.test(sinMarcas) || /^[{}]+;?$/.test(sinMarcas) || reMetodo.test(lin) || /[{}]\s*$/.test(sinMarcas) || /,\s*$/.test(sinMarcas) || /^[{]/.test(sinMarcas);
    const sigue = (lineas.slice(k + 1).find(function (x) { return x.replace(new RegExp(M + "K\\d+" + M, "g"), "").trim(); }) || "").trim();
    if (!esEstructura && !/;\s*$/.test(sinMarcas) && !/^[.+\-*/&|?:]/.test(sigue)) return err(k, "Falta el punto y coma ; al final de esta línea. En C# cada instrucción termina con ;  (error CS1002)");
    // llaves para saber dónde termina el método
    if (metodo) {
      for (const ch of lin) { if (ch === "{") profundidad++; else if (ch === "}") profundidad--; }
      if (profundidad <= 0 && /\}/.test(lin) && k > inicioMetodo) {
        if (metodo.tipo !== "void" && !tieneReturn) return err(inicioMetodo, "El método " + metodo.nombre + " debe devolver un " + metodo.tipo + ", pero no tiene ningún return. (error CS0161)");
        metodo = null;
      }
    }
  }
  return null;
}

function aJavaScript(cod, lits) {

  s = s.replace(/\bnew\s+(int|double|long|float)\s*\[([^\],]+)\]/g, "new Array($2).fill(0)");

// Traduce mensajes de error a algo entendible.
function traducirError(msg) {

function redondo(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function dibujar() {
  const t = performance.now();
  ctx.fillStyle = "#0c0b16"; ctx.fillRect(0, 0, lienzo.width, lienzo.height);
  ctx.strokeStyle = "rgba(255,255,255,0.035)"; ctx.lineWidth = 1;
  for (let f = 0; f <= FILAS; f++) { ctx.beginPath(); ctx.moveTo(0, f * TAM + .5); ctx.lineTo(COLS * TAM, f * TAM + .5); ctx.stroke(); }
  for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c * TAM + .5, 0); ctx.lineTo(c * TAM + .5, FILAS * TAM); ctx.stroke(); }
  if (!juego) return;
  const colores = {};
  ["#", ".", "o", " "].forEach(function (ch) { colores[ch] = colorConsola(llamar("ColorDeCasilla", ch)); });
  for (let f = 0; f < FILAS; f++) for (let c = 0; c < COLS; c++) {
    const ch = juego.mapa[f][c], x = c * TAM, y = f * TAM, col = colores[ch];
    if (!col) continue;
    ctx.fillStyle = col;
    if (ch === "#") { redondo(x + 2, y + 2, TAM - 4, TAM - 4, 5); ctx.fill(); }
    else if (ch === ".") { ctx.beginPath(); ctx.arc(x + TAM / 2, y + TAM / 2, 3, 0, 7); ctx.fill(); }
    else if (ch === "o") { ctx.beginPath(); ctx.arc(x + TAM / 2, y + TAM / 2, 5.5 + Math.sin(t / 180) * 1.5, 0, 7); ctx.fill(); }
  }
  // fantasmas
  juego.fantasmas.forEach(function (g) {
    const x = g.c * TAM + TAM / 2, y = g.f * TAM + TAM / 2, r = 9;
    ctx.fillStyle = g.color;
    ctx.beginPath(); ctx.arc(x, y - 1, r, Math.PI, 0); ctx.lineTo(x + r, y + r);
    for (let k = 0; k < 3; k++) { const x1 = x + r - (k * 2 + 1) * (r / 3); ctx.lineTo(x1, y + r - 4 + ((Math.floor(t / 150) + k) % 2) * 2); ctx.lineTo(x + r - (k + 1) * (2 * r / 3), y + r); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x - 3.5, y - 2, 3, 0, 7); ctx.arc(x + 3.5, y - 2, 3, 0, 7); ctx.fill();
    ctx.fillStyle = "#1a1840";
    ctx.beginPath(); ctx.arc(x - 3, y - 1.5, 1.5, 0, 7); ctx.arc(x + 4, y - 1.5, 1.5, 0, 7); ctx.fill();
  });
  // jugador: una carita
  const j = juego.j, jx = j.c * TAM + TAM / 2, jy = j.f * TAM + TAM / 2;
  const salto = j.dir && juego.estado === "jugando" && activo ? Math.abs(Math.sin(t / 90)) * 1.5 : 0;
  ctx.fillStyle = config.colorJugador;
  ctx.beginPath(); ctx.arc(jx, jy - salto, 10, 0, 7); ctx.fill();
  let ox = 0, oy = 0;
  if (j.dir === "arriba") oy = -2; else if (j.dir === "abajo") oy = 2; else if (j.dir === "izquierda") ox = -2; else if (j.dir === "derecha") ox = 2;
  ctx.fillStyle = "#1a1840";
  ctx.beginPath(); ctx.arc(jx - 3.5 + ox, jy - 2.5 + oy - salto, 1.8, 0, 7); ctx.arc(jx + 3.5 + ox, jy - 2.5 + oy - salto, 1.8, 0, 7); ctx.fill();
  ctx.strokeStyle = "#1a1840"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(jx + ox, jy + 1.5 + oy - salto, 4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  // capas
  let texto = null, sub = null;
  if (juego.estado === "gano") { texto = "¡GANASTE! 🎉"; sub = "Puntos: " + juego.puntaje + " · toca Reiniciar"; }
  else if (juego.estado === "perdio") { texto = "GAME OVER"; sub = "Puntos: " + juego.puntaje + " · toca Reiniciar"; }
  else if (juego.pausa > 0) { texto = "¡Prepárate!"; }
  else if (!activo) { sub = "⏸  Presiona una flecha para jugar"; }
  if (texto || sub) {
    if (texto) { ctx.fillStyle = "rgba(12,11,22,.72)"; ctx.fillRect(0, 0, lienzo.width, lienzo.height); }
    ctx.textAlign = "center"; ctx.fillStyle = "#fff";
    if (texto) { ctx.font = "800 34px system-ui, sans-serif"; ctx.fillText(texto, lienzo.width / 2, lienzo.height / 2); }
    if (sub) {
      ctx.font = "600 15px system-ui, sans-serif";
      const y = texto ? lienzo.height / 2 + 32 : lienzo.height - 16;
      if (!texto) { ctx.fillStyle = "rgba(12,11,22,.8)"; ctx.fillRect(0, y - 20, lienzo.width, 28); ctx.fillStyle = "#fff"; }
      ctx.fillText(sub, lienzo.width / 2, y);
    }
  }
  // marcador
  $("#hudPuntos").textContent = "Puntos: " + juego.puntaje;
  $("#hudVidas").textContent = "Vidas: " + (juego.vidas > 0 ? "❤".repeat(juego.vidas) : "—");
  const q = quedan();
  $("#hudQuedan").textContent = "Quedan: " + (q === null ? "?" : q);
  const radar = $("#hudRadar");
  if (tiene("Distancia")) {
    let min = null;
    juego.fantasmas.forEach(function (g) { const d = llamar("Distancia", j.f, j.c, g.f, g.c); if (typeof d === "number" && isFinite(d) && (min === null || d < min)) min = d; });
    radar.classList.remove("oculto");
    radar.textContent = "📏 Fantasma a " + (min === null ? "?" : min) + " pasos";
  } else radar.classList.add("oculto");
}

async function accionPie(ej, ctrl) {
  const pie = $("#pie"), msg = $("#pieMsg"), btn = $("#btnPie");
  if (lec.estado === "revisado") { siguienteEjercicio(lec.ultimoOk); return; }
  if (lec.estado === "esperando") return;
  lec.estado = "esperando"; btn.disabled = true;
  const r = await ctrl.comprobar();
  if (r.reintentar) { lec.estado = "respondiendo"; btn.disabled = !ctrl.listo(); if (r.msg) { pie.className = "pie mal"; msg.innerHTML = r.msg; } return; }
  lec.estado = "revisado"; lec.ultimoOk = r.ok;
  pie.className = "pie " + (r.ok ? "bien" : "mal");
  const frases = ["¡Excelente!", "¡Muy bien!", "¡Perfecto!", "¡Así se hace!", "¡Genial!"];
  msg.innerHTML = "<b>" + (r.ok ? frases[Math.floor(Math.random() * frases.length)] : "Casi…") + "</b>" + (r.msg || "");
  btn.textContent = "Continuar"; btn.disabled = false;
  sonar(r.ok ? "bien" : "mal");
  if (!r.ok && r.cuesta !== false) { lec.corazones--; lec.errores++; $(".corazones").textContent = "❤ " + lec.corazones; }
  btn.focus();
}

function siguienteEjercicio(ok) {
  const k = lec.cola.shift();

function codigoHtml(src) { return '<pre class="codigo">' + esc(src) + "</pre>"; }
function mezclar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function formatoIA(t) {
  const partes = String(t).split(/```[a-z]*\n?/);
  return partes.map(function (p, k) {
    if (k % 2 === 1) return "<pre>" + esc(p.replace(/\n$/, "")) + "</pre>";
    return esc(p).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, '<code class="in">$1</code>').replace(/\n/g, "<br>");
  }).join("");
}

    let sel = -1;
    caja.innerHTML = '<div class="tipo">🤖 Usar bien la IA</div><h3>' + esc(ej.pregunta) + '</h3><div class="opciones">' +
      ej.opciones.map(function (o, k) { return '<button class="opcion" data-k="' + k + '">' + esc(o.txt) + "</button>"; }).join("") + "</div>";
    const correcta = ej.opciones.findIndex(function (o) { return o.ok; });
    const ctrl = {
      listo: function () { return sel >= 0; },
      comprobar: function () {
        const ok = sel === correcta;
        caja.querySelectorAll(".opcion").forEach(function (b, k) { b.disabled = true; if (k === correcta) b.classList.add("bien"); else if (k === sel) b.classList.add("mal"); });
        return { ok: ok, msg: esc(ej.opciones[sel].por) + (ok ? "" : "<br><b style='display:inline;font-size:inherit'>La mejor:</b> " + esc(ej.opciones[correcta].por)) + "<br>📌 <i>" + esc(ej.regla) + "</i>" };
      }
    };
    caja.querySelectorAll(".opcion").forEach(function (b) { b.addEventListener("click", function () { caja.querySelectorAll(".opcion").forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); sel = +b.dataset.k; ctrl.alCambiar(); }); });
    return ctrl;
  },

  ia_revisa: function (caja, ej) {
    let sel = -1;
    caja.innerHTML = '<div class="tipo">🤖 Revisa lo que dice la IA</div><h3>' + esc(ej.pregunta) + '</h3><div class="lineas-revisar">' +
      ej.lineas.map(function (l, k) { return '<button data-k="' + k + '"><span class="num">' + (k + 1) + "</span>" + esc(l) + "</button>"; }).join("") + "</div>";
    const ctrl = {
      listo: function () { return sel >= 0; },
      comprobar: function () {
        const ok = sel === ej.mala;
        caja.querySelectorAll(".lineas-revisar button").forEach(function (b, k) { b.disabled = true; if (k === ej.mala) b.classList.add("bien"); });
        return { ok: ok, msg: (ok ? "" : "<span>El error está en la línea " + (ej.mala + 1) + ".</span><br>") + esc(ej.explicacion) + "<br>📌 <i>" + esc(ej.regla) + "</i>" };
      }
    };
    caja.querySelectorAll(".lineas-revisar button").forEach(function (b) { b.addEventListener("click", function () { caja.querySelectorAll(".lineas-revisar button").forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); sel = +b.dataset.k; ctrl.alCambiar(); }); });
    return ctrl;
  },

  ia_escribe: function (caja, ej) {
    caja.innerHTML = '<div class="tipo">🤖 Escríbele a la IA</div><h3>Practica cómo pedirle ayuda a la IA</h3><div>' + ej.tarea + '</div>' +
      '<textarea class="prompt" id="prompt" placeholder="Escribe aquí tu mensaje para la IA…"></textarea>' +
      '<p style="margin:8px 0 0;color:var(--muted);font-size:14px">Un buen mensaje…</p><ul class="checklist" id="check">' + ej.criterios.map(function (c) { return "<li>" + esc(c.txt) + "</li>"; }).join("") + '</ul>' +
      '<div class="chat" id="chat"></div><p style="color:var(--muted);font-size:13px;margin-top:10px">Esta es una IA <b>simulada</b> para practicar: responde según qué tan bueno es tu mensaje.</p>';
    const ta = $("#prompt", caja);
    function cumplidos() { const t = normalizar(ta.value); return ej.criterios.map(function (c) { return new RegExp(c.re).test(t); }); }
    function pintar() { const c = cumplidos(); caja.querySelectorAll("#check li").forEach(function (li, k) { li.classList.toggle("si", c[k]); }); if (ctrl.alCambiar) ctrl.alCambiar(); }
    const ctrl = {
      textoBoton: "Enviar a la IA",
      listo: function () { return ta.value.trim().length >= 10; },
      comprobar: function () {
        const c = cumplidos(), n = c.filter(Boolean).length, todos = n === c.length;
        const chat = $("#chat", caja);
        chat.innerHTML = '<div class="burbuja yo">' + esc(ta.value.trim()) + '</div><div class="burbuja ia"><div class="quien">🤖 IA (simulada)</div><span>…</span></div>';
        const resp = n < Math.ceil(c.length / 2) ? ej.vaga : ej.buena;
        return new Promise(function (res) {
          setTimeout(function () {
            chat.querySelector(".burbuja.ia span").outerHTML = "<div>" + formatoIA(resp) + "</div>";
            const faltan = ej.criterios.filter(function (_, k) { return !c[k]; }).map(function (x) { return "• " + esc(x.txt); }).join("<br>");
            if (todos) { ta.disabled = true; res({ ok: true, msg: "Tu mensaje tiene todo lo que necesita una buena pregunta.<br>📌 <i>" + esc(ej.regla) + "</i>" }); }
            else res({ reintentar: true, msg: "<b>" + (resp === ej.vaga ? esc(ej.notaVaga) : "¡Vas bien! La IA te entendió, pero tu mensaje puede mejorar.") + "</b>Le faltó:<br>" + faltan + "<br>Edita tu mensaje y vuelve a enviarlo." });
            chat.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }, 700);
        });
      }
    };
    ta.addEventListener("input", pintar);
    return ctrl;
  },

  codigo: function (caja, ej, un) {
    const u = UNIDADES.indexOf(un);
    let codigo = prog.codigos["borrador" + u] || prog.codigos[u] || ej.inicial;
    let pistasVistas = 0, ultimo = null, temporizador = null, version = 0;
    caja.innerHTML = '<div class="tipo">💻 Escribe la pieza en C#</div><h3>' + esc(ej.titulo) + "</h3><p>" + ej.enunciado + '</p>' +
      '<div class="editor-caja"><div class="gutter" id="gutter">1</div><textarea class="editor" id="editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>' +
      '<div class="acciones-codigo"><button class="btn-sec" id="btnPista">💡 Pista</button><button class="btn-sec" id="btnOriginal">↺ Empezar de nuevo</button>' + (MODO_PROFE ? '<button class="btn-sec" id="btnSol">👩‍🏫 Ver solución</button>' : "") + '</div>' +
      '<div id="pistas"></div><p class="estado-codigo" id="estado" style="margin-top:12px">⏳ Revisando…</p><div id="errorCod"></div><ul class="pruebas" id="pruebas"></ul><div id="consola"></div>';
    const ed = $("#editor", caja), gutter = $("#gutter", caja);
    ed.value = codigo;
    function lineas() { const n = ed.value.split("\n").length; let s = ""; for (let i = 1; i <= n; i++) s += i + "\n"; gutter.textContent = s; ed.rows = Math.max(12, n + 1); }
    ed.addEventListener("scroll", function () { gutter.scrollTop = ed.scrollTop; });
    ed.addEventListener("focus", function () { activo = false; });
    ed.addEventListener("keydown", function (e) {
      if (e.key === "Tab") { e.preventDefault(); insertar("  "); }
      else if (e.key === "Enter") {
        e.preventDefault();
        const ini = ed.value.lastIndexOf("\n", ed.selectionStart - 1) + 1;
        const lin = ed.value.slice(ini, ed.selectionStart);
        let sangria = (lin.match(/^\s*/) || [""])[0];
        if (/[{[(]\s*$/.test(lin)) sangria += "  ";
        insertar("\n" + sangria);
      }
    });
    function insertar(t) {
      const a = ed.selectionStart, b = ed.selectionEnd;
      ed.value = ed.value.slice(0, a) + t + ed.value.slice(b);
      ed.selectionStart = ed.selectionEnd = a + t.length;
      cambio();
    }
    function cambio() {
      lineas();
      prog.codigos["borrador" + u] = ed.value; guardar();
      $("#estado", caja).textContent = "⏳ Revisando…";
      clearTimeout(temporizador);
      temporizador = setTimeout(revisar, 450);
    }
    async function revisar() {
      const mio = ++version;
      const src = ed.value;
      const r = await revisarCodigo(u, src, ej);
      if (mio !== version) return;
      ultimo = r;
      const est = $("#estado", caja), err = $("#errorCod", caja), pr = $("#pruebas", caja), con = $("#consola", caja);
      err.innerHTML = r.error ? '<div class="error-codigo">❌ ' + esc(r.error) + (r.errorOriginal ? '<br><small style="opacity:.75">Mensaje original: ' + esc(r.errorOriginal) + "</small>" : "") + "</div>" : "";
      pr.innerHTML = (r.pruebas || []).map(function (p) { return '<li class="' + (p.ok ? "si" : "no") + '">' + (p.ok ? "✅ " : "❌ ") + esc(p.msg) + "</li>"; }).join("");
      con.innerHTML = r.logs && r.logs.length ? '<p style="margin:10px 0 4px;font-weight:700;font-size:14px">🖥️ console.log</p><div class="consola">' + esc(r.logs.join("\n")) + "</div>" : "";
      if (r.error) est.textContent = "Hay un problema en tu código:";
      else if (r.ok) est.innerHTML = '<span style="color:var(--ok)">✅ ¡Todas las pruebas pasan! Mira tu juego → y toca Comprobar.</span>';
      else { const n = r.pruebas.filter(function (p) { return p.ok; }).length; est.textContent = "Pruebas: " + n + " de " + r.pruebas.length + " ✓ — el juego ya usa tu código, ¡míralo!"; }
      if (r.instalable) instalarVivo(u, src);
      if (ctrl.alCambiar) ctrl.alCambiar();
    }
    ed.addEventListener("input", cambio);
    $("#btnPista", caja).addEventListener("click", function () {
      if (pistasVistas < ej.pistas.length) { pistasVistas++; $("#pistas", caja).innerHTML = ej.pistas.slice(0, pistasVistas).map(function (p, k) { return '<div class="pista">💡 <b>Pista ' + (k + 1) + ":</b> " + esc(p) + "</div>"; }).join(""); }
      if (pistasVistas >= ej.pistas.length) this.disabled = true;
    });
    $("#btnOriginal", caja).addEventListener("click", function () { ed.value = ej.inicial; cambio(); });
    if (MODO_PROFE) $("#btnSol", caja).addEventListener("click", function () { ed.value = ej.solucion; cambio(); });
    const ctrl = {
      listo: function () { return !!(ultimo && ultimo.ok); },
      comprobar: function () {
        if (!(ultimo && ultimo.ok)) return { reintentar: true, msg: "<b>Todavía hay pruebas que fallan.</b>Revisa las ❌ de arriba." };
        prog.codigos[u] = ed.value; delete prog.codigos["borrador" + u]; guardar();
        ed.disabled = true;
        return { ok: true, msg: "Tu pieza «" + esc(un.pieza) + "» ya está en el juego." };
      }
    };
    lineas(); revisar();
    return ctrl;
  }
};

// Huecos con banco de fichas (para "hueco" y "diagrama").
function rellenarHuecos(caja, ej, tipoTxt, esDiagrama) {
  const huecos = [];  // {correcta, valor}
  const distractores = [];
  function procesar(texto) {
    return esc(texto).replace(/\[\[(.+?)\]\]/g, function (_, dentro) {
      const ops = dentro.split("|").map(function (s) { return s.replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"); });
      huecos.push({ correcta: ops[0], valor: null });
      ops.slice(1).forEach(function (o) { distractores.push(o); });
      return '<span class="hueco vacio" data-h="' + (huecos.length - 1) + '">____</span>';
    });
  }
  let cuerpo;
  if (esDiagrama) {
    cuerpo = '<div class="diagrama">' + ej.nodos.map(function (n, k) {
      const ml = (n.nivel || 0) * 26;
      let h = '<div class="dnodo" style="margin-left:' + ml + 'px"><span class="forma f-' + n.f + '">' + (n.f === "ciclo" ? "↻ " : "") + procesar(n.txt) + "</span>";
      if (n.si) h += '<span class="flecha-si">Sí →</span><span class="forma f-proc">' + procesar(n.si) + "</span>";
      h += "</div>";
      if (k < ej.nodos.length - 1) h += '<div class="flecha-abajo" style="margin-left:' + ml + 'px">' + (n.f === "dec" ? "↓ No" : "↓") + "</div>";
      return h;
    }).join("") + "</div>";
  } else {
    cuerpo = '<pre class="codigo">' + procesar(ej.codigo) + "</pre>";
  }
  const correctas = huecos.map(function (h) { return h.correcta; });
  const banco = mezclar(correctas.concat(distractores.filter(function (d, i, a) { return a.indexOf(d) === i && correctas.indexOf(d) < 0; })))
    .map(function (t) { return { t: t, usada: false }; });
  caja.innerHTML = '<div class="tipo">' + tipoTxt + "</div><h3>" + esc(ej.pregunta) + "</h3>" + cuerpo + '<div class="banco" id="banco"></div>';
  const ctrl = {
    listo: function () { return huecos.every(function (h) { return h.valor !== null; }); },
    comprobar: function () {
      let ok = true;
      caja.querySelectorAll(".hueco").forEach(function (el) { const h = huecos[+el.dataset.h]; const b = h.valor.t === h.correcta; ok = ok && b; el.classList.add(b ? "bien" : "mal"); if (!b) el.textContent = h.valor.t + " → " + h.correcta; });
      caja.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
      bloqueado = true;
      return { ok: ok, msg: esc(ej.explicacion) };
    }
  };
  let bloqueado = false;
  function pintar() {
    caja.querySelectorAll(".hueco").forEach(function (el) {
      const h = huecos[+el.dataset.h];
      el.textContent = h.valor ? h.valor.t : "____";
      el.classList.toggle("vacio", !h.valor);
    });
    $("#banco", caja).innerHTML = banco.map(function (f, i) { return '<button class="ficha ' + (f.usada ? "usada" : "") + '" data-i="' + i + '">' + esc(f.t) + "</button>"; }).join("");
    $("#banco", caja).querySelectorAll(".ficha").forEach(function (b) {
      b.addEventListener("click", function () {
        if (bloqueado) return;
        const f = banco[+b.dataset.i];
        const libre = huecos.find(function (h) { return h.valor === null; });
        if (!libre || f.usada) return;
        libre.valor = f; f.usada = true; pintar();
      });
    });
    if (ctrl.alCambiar) ctrl.alCambiar();
  }
  caja.addEventListener("click", function (e) {
    const el = e.target.closest(".hueco");
    if (!el || bloqueado) return;
    const h = huecos[+el.dataset.h];
    if (h.valor) { h.valor.usada = false; h.valor = null; pintar(); }
  });
  pintar();
  return ctrl;
}
